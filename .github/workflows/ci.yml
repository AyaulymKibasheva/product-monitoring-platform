name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Normalization tests
        run: python -m pytest -q --no-cov tests/test_normalization.py
      - name: Validation tests
        run: python -m pytest -q --no-cov tests/test_validation.py
      - name: Change detection tests
        run: python -m pytest -q --no-cov tests/test_change_detection.py
      - name: Matching tests
        run: python -m pytest -q --no-cov tests/test_matching.py
      - name: Source adapter tests
        run: python -m pytest -q --no-cov tests/test_books_scraper.py tests/test_dummyjson_source.py tests/test_file_source.py tests/test_javascript_source.py tests/test_source_registry.py tests/test_source_catalog.py
      - name: Persistence and feature tests
        run: python -m pytest -q --no-cov tests/test_database.py tests/test_runner.py tests/test_scheduler.py tests/test_reports.py tests/test_notifications.py tests/test_dashboard.py
      - name: Tests
        run: python -m pytest
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build application image
        run: docker build -t product-monitoring-platform:test .
